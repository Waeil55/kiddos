# Uploads the App Store listing (text in fastlane/metadata, screenshots in fastlane/screenshots) to App Store Connect.
# Uses the same four secrets as the iOS build. Does not upload a build and does not submit for review.
name: iOS App Store listing

on:
  workflow_dispatch:

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Save the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          ruby -rjson -e 'puts JSON.generate({key_id: ENV["ASC_KEY_ID"], issuer_id: ENV["ASC_ISSUER_ID"], key: ENV["ASC_KEY_P8"], in_house: false})' > "$RUNNER_TEMP/keys/asc.json"

      - name: Upload listing and screenshots
        env:
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
        run: |
          printf '%s' "$REVIEW_PHONE" > fastlane/metadata/review_information/phone_number.txt
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/keys/asc.json" \
            --app_identifier care.agape.kiddos \
            --platform ios \
            --app_version 1.0.0 \
            --skip_binary_upload true \
            --skip_app_version_update false \
            --overwrite_screenshots true \
            --metadata_path fastlane/metadata \
            --screenshots_path fastlane/screenshots \
            --submit_for_review false \
            --automatic_release false \
            --run_precheck_before_submit false \
            --force true

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
